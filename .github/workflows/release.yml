name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true
        default: 0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Select version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            "LIGHTSTICK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "LIGHTSTICK_VERSION=${{ inputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build source and portable release
        shell: pwsh
        run: ./scripts/build-distribution.ps1 -Version $env:LIGHTSTICK_VERSION

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LightstickStudio-${{ env.LIGHTSTICK_VERSION }}
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/*.zip artifacts/SHA256SUMS.txt --generate-notes --title "Lightstick Studio ${{ github.ref_name }}"
